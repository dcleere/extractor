[project]
name = "extractor"
version = "0.1.0"
description = "This codebase ensures you ADHERE to your products' regulations."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
extractor = "extractor.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
